[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalfire-ai"
version = "1.0.0"
description = "AI-powered business intelligence, anomaly detection, cross-dataset risk discovery, and decision support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SIGNALFIRE AI Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "duckdb>=0.10.0",
    "pyexasol>=3.0.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.1.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = "test_*.py"
